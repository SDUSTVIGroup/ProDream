name: "ProDream"
tag: "${rmspace:${system.prompt_processor.prompt},_}"
exp_root_dir: "outputs"
seed: 0

data_type: "random-multiview-camera-datamodule"
data:
  batch_size: [1,1] # must be dividable by n_view
  n_view: 1
  # 0-4999: 64x64, >=5000: 256x256
  width: [64, 256]
  height: [64, 256]
  resolution_milestones: [4000]
  camera_distance_range: [0.8, 1.0] # relative
  fovy_range: [15, 60]
  elevation_range: [0, 30]
  camera_perturb: 0.
  center_perturb: 0.
  up_perturb: 0.
  n_val_views: 4
  eval_camera_distance: 3.0
  eval_fovy_deg: 40.

system_type: "ProDream-system"
system:
  stage: coarse
  visualize_samples: true
  geometry_type_c: "implicit-sdf"
  geometry_c:
    radius: 1.0
    n_feature_dims: 3
    isosurface_resolution: 128
    isosurface_deformable_grid: true
    isosurface_coarse_to_fine: false
    shape_init: ???
    shape_init_params: 0.75

  material_type_c: "no-material"

  background_type_c: "solid-color-background"

  renderer_type_c: "nvdiff-rasterizer"

  geometry_type: "implicit-volume"
  geometry:
    radius: 1.0

    density_bias: "blob_magic3d"
    density_activation: softplus
    density_blob_scale: 10.
    density_blob_std: 0.5

    pos_encoding_config:
      otype: HashGrid
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 16
      per_level_scale: 1.447269237440378 # max resolution 4096

  material_type: "no-material"
  material:
    n_output_dims: 3
    color_activation: sigmoid

  background_type: "neural-environment-map-background"
  background:
    color_activation: sigmoid
    random_aug: true
    random_aug_prob: 0.75

  renderer_type: "nerf-volume-renderer"
  renderer:
    radius: ${system.geometry.radius}
    num_samples_per_ray: 512

  prompt_processor_type: "stable-diffusion-prompt-processor"
  prompt_processor:
    pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
    prompt: ???
    front_threshold: 30.
    back_threshold: 30.
    use_perp_neg: true

  guidance_type: "fused-control-guidance"
  guidance:
    pretrained_model_name_or_path: "runwayml/stable-diffusion-v1-5"
    pretrained_model_name_or_path_lora: "runwayml/stable-diffusion-v1-5"
    controlnet_name_or_path: "lllyasviel/control_v11p_sd15_scribble"
    control_type: "hed"
    guidance_scale: 7.5
    condition_scale: 0.5
    guidance_scale_lora: 1
    lora_scale: [0, 0.5, 0.75, 5000]
    min_step_percent: 0.02
    max_step_percent: [5000, 0.98, 0.9, 5001] # annealed to 0.5 after 5000 steps

    prompt_processor_type_lora: "stable-diffusion-prompt-processor"
    prompt_processor_lora:
      pretrained_model_name_or_path: ${system.guidance.pretrained_model_name_or_path_lora}
      prompt: ${system.prompt_processor.prompt}
      front_threshold: 30.
      back_threshold: 30.

  loggers:
    wandb:
      enable: false
      project: "threestudio"
      name: None

  loss:
    lambda_vsd: 1.
    lambda_lora: 1.
    lambda_orient: 0.
    lambda_sparsity: 20.
    lambda_opaque: [10000, 0.0, 1000.0, 10001]
    lambda_z_variance: 0.

  optimizer:
    name: AdamW
    args:
      betas: [0.9, 0.99]
      eps: 1.e-15
    params:
      geometry.encoding:
        lr: 0.01
      geometry.density_network:
        lr: 0.001
      geometry.feature_network:
        lr: 0.001
      background:
        lr: 0.001
      guidance:
        lr: 0.0001

trainer:
  max_steps: 10000
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  val_check_interval: 200
  enable_progress_bar: true
  precision: 32

checkpoint:
  save_last: true
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}
